<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pompous Pomegranate - Fake news to cure the blues</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top Announcement Bar -->
    <div class="announcement-bar" id="breakingBar" style="display: none;">
        <div class="container" id="breakingContent">
            <!-- Dynamically populated breaking news -->
        </div>
    </div>

    <!-- Custom Notification Toast -->
    <div id="toastNotification" class="toast-notification">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMessage">Action completed successfully!</span>
    </div>

    <!-- Site Header -->
    <header class="site-header">
        <div class="header-container">
            <div class="header-left">
                <span class="current-date" id="currentDate"></span>
            </div>
            
            <div class="logo-area">
                <a href="#" class="site-title-link">
                    <div class="brand-logo-wrapper">
                        <i class="fa-solid fa-seedling pomegranate-icon" style="color: var(--gold-color); font-size: 2rem;"></i>
                        <div class="brand-title-text">
                            <span class="title-prefix">THE</span>
                            <span class="title-main">Pompous Pomegranate</span>
                            <span class="site-tagline">Fake news to cure the blues</span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="header-right">
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button id="openModalBtn" class="subscribe-btn">
                    <i class="fa-solid fa-seedling"></i> Get The Daily Seed
                </button>
            </div>
        </div>

        <!-- Navigation Bar -->
        <nav class="main-nav">
            <ul>
                <li><a href="#" class="nav-link active" data-category="all">Home</a></li>
                <li><a href="#" class="nav-link" data-category="politics">Politics</a></li>
                <li><a href="#" class="nav-link" data-category="tech">Tech & AI</a></li>
                <li><a href="#" class="nav-link" data-category="culture">Culture</a></li>
                <li><a href="#" class="nav-link" data-category="opinion">Opinion</a></li>
                <li><a href="#" class="nav-link" data-category="pitches">Community Pitches</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Layout -->
    <div class="container main-layout">
        
        <!-- Left Feed -->
        <main class="content-feed">
            <div class="feed-controls">
                <div class="search-box">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search headlines, politicians, absurd claims...">
                </div>
                <div class="badge-filter">
                    <span class="satire-badge"><i class="fa-solid fa-check-circle"></i> 100% Verified Satire</span>
                </div>
            </div>

            <!-- Articles Grid -->
            <div class="articles-grid" id="articlesGrid">
                <!-- Dynamically populated from Sanity API -->
            </div>
        </main>

        <!--
