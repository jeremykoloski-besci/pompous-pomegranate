<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pompous Pomegranate</title>
    <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body style="background: var(--bg-primary, #f9fafb); font-family: 'Inter', sans-serif; margin: 0; padding: 0;">

    <!-- Top Navigation Bar -->
    <header style="background: #18181b; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;">
        <a href="/" style="color: #fff; text-decoration: none; font-family: 'Zilla Slab', serif; font-size: 24px; font-weight: bold;">The Pompous Pomegranate</a>
        <button onclick="window.location.href='/'" style="background: #27272a; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 500;">&larr; Back to Home</button>
    </header>

    <!-- Article Container -->
    <main id="singleArticleContainer" style="max-width: 800px; margin: 40px auto; padding: 32px; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <p style="color: #666; text-align: center;">Loading satire...</p>
    </main>

    <script>
        async function loadArticleDetail() {
            const path = window.location.pathname;
            const slug = path.split('/article/')[1];
            const container = document.getElementById('singleArticleContainer');

            if (!slug) {
                container.innerHTML = '<h1>Article Not Found</h1><p>No slug provided.</p>';
                return;
            }

            try {
                const response = await fetch(`/api/posts?slug=${slug}`);
                if (!response.ok) throw new Error('Failed to fetch article');
                
                const data = await response.json();
                const post = data.result;

                if (!post) {
                    container.innerHTML = `
                        <h1>Article Not Found</h1>
                        <p>This satire piece couldn't be found or is still awaiting publication.</p>
                    `;
                    return;
                }

                let htmlContent = '<p>No content provided.</p>';
                if (Array.isArray(post.body)) {
                    htmlContent = post.body.map(block => {
                        if (block._type === 'block' && block.children) {
                            return `<p style="margin-bottom: 16px; line-height: 1.8;">${block.children.map(c => c.text).join('')}</p>`;
                        }
                        return '';
                    }).join('');
                }

                container.innerHTML = `
                    <h1 style="font-size: 36px; margin-bottom: 12px; font-weight: 700; font-family: 'Zilla Slab', serif;">${post.title}</h1>
                    <div style="color: #666; margin-bottom: 24px; font-size: 14px; border-bottom: 1px solid #eee; padding-bottom: 12px;">
                        By ${post.author || 'Anonymous Pomp'} • ${new Date(post.publishedAt).toLocaleDateString()}
                    </div>
                    ${post.imageUrl ? `<img src="${post.imageUrl}" alt="Article image" style="width: 100%; max-height: 450px; object-fit: cover; border-radius: 6px; margin-bottom: 24px;">` : ''}
                    <div style="font-size: 18px; color: #27272a; line-height: 1.7;">${htmlContent}</div>
                `;
            } catch (err) {
                console.error("Error loading article:", err);
                container.innerHTML = '<h1>Error</h1><p>Failed to load this satire piece.</p>';
            }
        }

        window.addEventListener('DOMContentLoaded', loadArticleDetail);
    </script>
</body>
</html>
